olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  elasticsearch: 1
  minio: 1
  aimragflow: 1
  redis: 1

metadata:
  name: aimragflow
  description: AIM RAGFlow — RAG engine optimized for Olares and Hermes Agent.
  icon: https://app.cdn.olares.com/appstore/ragflow/icon.png
  appid: aimragflow
  version: '26.9.8'
  title: AIM RAGFlow
  categories:
  - AI

entrances:
- name: aimragflow
  host: aimragflow
  port: 80
  title: AIM RAGFlow
  icon: https://app.cdn.olares.com/appstore/ragflow/icon.png
  authLevel: private
  openMethod: window
- name: mcp
  host: aimragflow
  port: 9382
  title: AIM RAGFlow MCP
  icon: https://app.cdn.olares.com/appstore/ragflow/icon.png
  authLevel: internal
  invisible: true

permission:
  appData: true
  appCache: true

spec:
  versionName: '0.27.2'
  featuredImage: https://app.cdn.olares.com/appstore/ragflow/1.webp
  promoteImage:
  - https://app.cdn.olares.com/appstore/ragflow/1.webp
  - https://app.cdn.olares.com/appstore/ragflow/2.webp
  - https://app.cdn.olares.com/appstore/ragflow/3.webp
  - https://app.cdn.olares.com/appstore/ragflow/4.webp
  - https://app.cdn.olares.com/appstore/ragflow/5.webp
  fullDescription: |
    AIM RAGFlow — a self-hosted RAG engine (upstream RAGFlow 0.27.2) repackaged
    for Olares and optimized for use from the Hermes Agent.

    **Model**
    Knowledge/retrieval backend. Runs documents through DeepDoc parsing, chunking,
    embedding and optional knowledge compilation; answers via Agentic RAG.

    **Inference Engine**
    Upstream RAGFlow 0.27.2 (`infiniflow/ragflow:v0.27.2`), patched for Olares
    (see image). Document engine: Elasticsearch 8.11.3. Object storage: MinIO.
    Cache/queue: Valkey 8. Metadata: shared MySQL middleware.

    **Key Features**
    - Agentic RAG with thinking modes None / Low / Medium / High / Ultra (v0.27.0, refactored in v0.27.2).
    - Knowledge Compilation: Wiki, Graph, Tree, PageIndex, Mind Map, Timeline, To Skills (replaces GraphRAG/RAPTOR).
    - OpenAI-compatible chat endpoint `/api/v1/chats_openai/<chat_id>` and a RAGFlow MCP server (`retrieve`).
    - Olares tuning baked in: MAX_CONCURRENT_CHUNK_BUILDERS=4, DOC_BULK_SIZE=50, EMBEDDING_BATCH_SIZE=16, close_stale age=3600, CPU 10 / RAM 12Gi.

    **API**
    Web UI at the entrance; OpenAI-compatible API via an API key. Wire Hermes via
    the chat-assistant endpoint (Agentic RAG) or the MCP `retrieve` tool (chunks).

    **Resource Usage**
    CPU: 2-10 cores
    RAM: 8-12 GiB (plus Elasticsearch/MinIO/Redis)
    Disk: appData volumes for logs, ES, MinIO, Redis

  upgradeDescription: |
    v26.9.6: Optional self-hosted PaddleOCR-VL as the PDF parser. New envs
    PADDLEOCR_BASE_URL (e.g. http://sharedentrances-paddleocr.paddleocrv3-shared)
    and PADDLEOCR_ALGORITHM (default PaddleOCR-VL). When set, RAGFlow
    auto-provisions a PaddleOCR OCR model; select "PaddleOCR" as the dataset PDF
    parser (layout_recognize) for uniform, high-quality parsing of text AND scans
    in a single dataset — no per-document config, no VLM/MinerU workarounds.

    v26.9.5: Configurable MCP launch mode. MCP_MODE=self-host (default) starts the
    MCP server with --mcp-host-api-key so clients (e.g. Hermes) use /mcp without a
    key; MCP_MODE=host keeps the official behaviour (client key, SSE only, now with
    --no-transport-streamable-http-enabled). MCP_API_KEY holds the RAGFlow key for
    self-host mode. MCP access stays on the internal, hidden entrance (port 9382).

    v26.9.4: Fix — the MCP container/Service port (9382) must always be present
    when the MCP entrance is declared; only the MCP server args are toggled by
    MCP_ENABLED. 26.9.3 made the port conditional, which blocked entrance
    reconciliation. Behaviour otherwise identical to 26.9.3.

    v26.9.3: Adopt Olares chart 1.0.38 integration — `--init-model-provider-tables`
    (idempotent model-provider table migration) and a separate MCP entrance (port
    9382, internal, hidden; toggle with MCP_ENABLED, default false). EMBEDDING_BATCH_SIZE
    is now an app setting (default 16; set 1 for conservative local-embedding memory).
    Kept AIM tuning: CPU 20 / RAM 16 GiB, TABLE_AUTO_ROTATE=false, DOC_BULK_SIZE=50,
    MAX_CONCURRENT_CHUNK_BUILDERS=4, close_stale(age=3600), no Infinity companion.
    Built for Olares 1.12.6.

    v26.9.2: Ingest performance — ragflow container CPU 10 → 20 and RAM 12 → 16 GiB;
    new env TABLE_AUTO_ROTATE (default false) skips DeepDOC per-table orientation
    scoring. Ingestion was CPU-throttled at the 10-core limit with table analysis
    at 100–190 s/page. Built for Olares 1.12.6.

    v26.9.1: Initial AIM release — RAGFlow 0.27.2 (`infiniflow/ragflow:v0.27.2`).
    Repackaged from the Olares chart 1.0.30 with Olares tuning baked in:
    MAX_CONCURRENT_CHUNK_BUILDERS=4, DOC_BULK_SIZE=50, EMBEDDING_BATCH_SIZE=16
    and close_stale(age=3600); ragflow container limited to CPU 10 / RAM 12Gi.
    Infinity companion removed (DOC_ENGINE=elasticsearch). Built for Olares 1.12.6.

    Upstream highlights since 0.26.4
    - 0.27.0: Agentic RAG with four thinking modes; Knowledge Compilation (Wiki, Graph, Tree, PageIndex, Mind Map, Timeline, To Skills); GraphRAG/RAPTOR deprecated.
    - 0.27.1: metadata filter pushdown, retrieval API exposes rerank_candidates_count / top_k / num_candidates.
    - 0.27.2: Agentic RAG refactor (reasoning speed + benchmark gains), knowledge compilation runtime settings and rate limit.

    Full release notes: https://github.com/infiniflow/ragflow/releases/tag/v0.27.2

  developer: Aimighty
  website: https://ragflow.io/
  sourceCode: https://github.com/bayerhazard/aimragflow
  submitter: Aimighty
  locale:
  - en-US
  doc: https://ragflow.io/docs/
  license:
  - text: Apache-2.0
    url: https://github.com/infiniflow/ragflow#Apache-2.0-1-ov-file
  requiredMemory: 7680Mi
  limitedMemory: 28Gi
  requiredDisk: 56Mi
  limitedDisk: 1Gi
  requiredCpu: 4
  limitedCpu: 24
  supportArch:
  - amd64

options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
  - name: mysql
    type: middleware
    version: '>=8.0.0'

middleware:
  mysql:
    username: aimragflow
    databases:
      - name: aimragflow

envs:
  - envName: HF_ENDPOINT
    required: true
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: TABLE_AUTO_ROTATE
    required: false
    applyOnChange: true
    default: "false"
    type: string
    editable: true
    description: "DeepDOC table auto-rotation scoring (true/false). false skips per-table orientation scoring — much faster ingest."
  - envName: MCP_ENABLED
    required: false
    applyOnChange: true
    default: "true"
    type: string
    editable: true
    description: "Enable the separate RAGFlow MCP entrance (hidden from desktop). Use its HTTPS address with /mcp (Streamable HTTP) or /sse (SSE). Clients must provide a RAGFlow API key. Disabled by default."
  - envName: MCP_MODE
    required: false
    applyOnChange: true
    default: "self-host"
    type: string
    editable: true
    description: "MCP launch mode: 'self-host' (recommended — server holds the API key; /mcp and /sse available) or 'host' (clients pass their own key; SSE only)."
    options:
      - title: Self-host (server key, /mcp)
        value: "self-host"
      - title: Host (client key, /sse)
        value: "host"
  - envName: MCP_API_KEY
    required: false
    applyOnChange: true
    default: ""
    type: password
    editable: true
    description: "RAGFlow API key (ragflow-...) the MCP server uses in self-host mode. Required when MCP_ENABLED=true and MCP_MODE=self-host."
  - envName: EMBEDDING_BATCH_SIZE
    required: false
    applyOnChange: true
    default: "16"
    type: int
    editable: true
    description: "Chunks embedded per request. 16 = tested on Olares One / local AIM embedder. Use 1 for conservative memory behavior (official default), increase for cloud embedding services."
  - envName: PADDLEOCR_BASE_URL
    required: false
    applyOnChange: true
    default: "http://sharedentrances-paddleocr.paddleocrv3-shared"
    type: string
    editable: true
    description: "Optional: base URL of a self-hosted PaddleOCR-VL server (e.g. the Olares paddleocrv3 shared entrance). When set, RAGFlow auto-provisions a PaddleOCR OCR model selectable as the PDF parser."
  - envName: PADDLEOCR_ALGORITHM
    required: false
    applyOnChange: true
    default: "PaddleOCR-VL"
    type: string
    editable: true
    description: "PaddleOCR algorithm used for the self-hosted server: PaddleOCR-VL (default), PP-OCRv5, PP-StructureV3, ..."
