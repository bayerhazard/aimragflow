{{- $olaresEnv := .Values.olaresEnv | default dict -}}
{{- $mcpEnabled := eq (toString ($olaresEnv.MCP_ENABLED | default "false")) "true" -}}
{{- $mcpMode := toString ($olaresEnv.MCP_MODE | default "self-host") -}}
{{- $embeddingBatchSize := "16" -}}
{{- if hasKey $olaresEnv "EMBEDDING_BATCH_SIZE" -}}
{{- $embeddingBatchSize = toString $olaresEnv.EMBEDDING_BATCH_SIZE | default "16" -}}
{{- end -}}
{{- if not (regexMatch "^[1-9][0-9]*$" $embeddingBatchSize) -}}
{{- fail "EMBEDDING_BATCH_SIZE must be a positive integer" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aimragflow
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.workloads.aimragflow.replicaCount }}
  selector:
    matchLabels:
      app: aimragflow
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: aimragflow
    spec:
      initContainers:
      - name: migrate-appcache-to-appdata
        image: "docker.io/beclab/busybox:1.37"
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c"]
        args:
          - |
            set -e
            SOURCE=/old-data
            DEST=/new-data
            MARKER="${DEST}/.migration_from_appcache_aimragflow_done"

            if [ -f "$MARKER" ]; then
              echo "[migrate] marker present, skip."
              exit 0
            fi

            if [ -n "$(ls -A "$DEST" 2>/dev/null | grep -v '^\.migration_from_appcache_aimragflow_done$' || true)" ]; then
              echo "[migrate] appData already has data, skip."
              echo "skipped existing dest at $(date -Iseconds 2>/dev/null || date)" > "$MARKER"
              exit 0
            fi

            if [ -n "$(ls -A "$SOURCE" 2>/dev/null || true)" ]; then
              echo "[migrate] copying appCache/aimragflow -> appData/aimragflow..."
              cp -a "$SOURCE"/. "$DEST"/
              echo "migrated from appCache at $(date -Iseconds 2>/dev/null || date)" > "$MARKER"
              echo "[migrate] done; legacy appCache left intact for rollback."
            else
              echo "[migrate] no legacy data, fresh install."
              echo "fresh install at $(date -Iseconds 2>/dev/null || date)" > "$MARKER"
            fi
        volumeMounts:
          - name: aimragflow-logs-legacy
            mountPath: /old-data
            readOnly: true
          - name: aimragflow-logs
            mountPath: /new-data
      - name: init-chmod-data
        image: "docker.io/beclab/aboveos-busybox:1.37.0"
        command:
          - sh
          - '-c'
          - |
            chown -R 1000:1000 /ragflow/logs
        resources: {}
        volumeMounts:
          - name: aimragflow-logs
            mountPath: /ragflow/logs
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
      containers:
      - name: aimragflow
        image: "ghcr.io/bayerhazard/aimragflow:v0.27.2-1"
        args:
          - --enable-adminserver
          - --init-model-provider-tables
          {{- if $mcpEnabled }}
          - --enable-mcpserver
          - --mcp-host=0.0.0.0
          - --mcp-port=9382
          - --mcp-base-url=http://127.0.0.1:9380
          {{- if eq $mcpMode "host" }}
          - --mcp-mode=host
          - --no-transport-streamable-http-enabled
          {{- else }}
          - --mcp-mode=self-host
          - --mcp-host-api-key={{ .Values.olaresEnv.MCP_API_KEY }}
          {{- end }}
          {{- end }}
        ports:
        - containerPort: 9380
        - containerPort: 9381
        - containerPort: 80
        - name: mcp
          containerPort: 9382
        env:
        - name: HF_ENDPOINT
          value: '{{ .Values.olaresEnv.HF_ENDPOINT }}'
        - name: MACOS
          value: '0'
        - name: API_PROXY_SCHEME
          value: 'python'
        - name: DOC_ENGINE
          value: 'elasticsearch'
        - name: TABLE_AUTO_ROTATE
          value: '{{ .Values.olaresEnv.TABLE_AUTO_ROTATE }}'
        - name: MAX_CONCURRENT_CHUNK_BUILDERS
          value: '4'
        - name: DOC_BULK_SIZE
          value: '50'
        - name: EMBEDDING_BATCH_SIZE
          value: {{ $embeddingBatchSize | quote }}
        {{- if .Values.olaresEnv.PADDLEOCR_BASE_URL }}
        - name: PADDLEOCR_BASE_URL
          value: {{ .Values.olaresEnv.PADDLEOCR_BASE_URL | quote }}
        - name: PADDLEOCR_ALGORITHM
          value: {{ .Values.olaresEnv.PADDLEOCR_ALGORITHM | default "PaddleOCR-VL" | quote }}
        {{- end }}
        - name: MYSQL_PORT
          value: "{{ .Values.mysql.port }}"
        - name: MYSQL_HOST
          value: "{{ .Values.mysql.host }}"
        - name: MYSQL_USER
          value: "{{ .Values.mysql.username }}"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets
              key: MYSQL_PASSWORD
        - name: MYSQL_DBNAME
          value: "{{ .Values.mysql.databases.aimragflow }}"
        - name: ES_HOST
          value: 'es01'
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets
              key: ELASTIC_PASSWORD
        - name: REDIS_HOST
          value: 'redis'
        - name: REDIS_PORT
          value: '6379'
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets
              key: REDIS_PASSWORD
        - name: MINIO_HOST
          value: 'minio'
        - name: MINIO_PORT
          value: '9000'
        - name: MINIO_USER
          value: 'rag_flow'
        - name: MINIO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets
              key: MINIO_PASSWORD
        resources:
          limits:
            cpu: "20"
            memory: 16Gi
          requests:
            cpu: "2"
            memory: 2Gi
        startupProbe:
          httpGet:
            path: /api/v1/system/healthz
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /api/v1/system/healthz
            port: 80
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/v1/system/ping
            port: 80
          initialDelaySeconds: 120
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 5
        volumeMounts:
          - name: aimragflow-logs
            mountPath: /ragflow/logs
      volumes:
      - hostPath:
          path: '{{ .Values.userspace.appData }}/aimragflow'
          type: DirectoryOrCreate
        name: aimragflow-logs
      - hostPath:
          path: '{{ .Values.userspace.appCache }}/aimragflow'
          type: DirectoryOrCreate
        name: aimragflow-logs-legacy
---
apiVersion: v1
kind: Service
metadata:
  name: aimragflow
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: mcp
    port: 9382
    targetPort: mcp
  selector:
    app: aimragflow
